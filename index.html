<!DOCTYPE html>
<!--
  Hero's Hour Build Calculator — build-first, overlay-driven.
  data.js is GENERATED by build-data.mjs; do not edit it by hand.

  Architecture (see the build-calc-planner references):
    - Build-first: the app opens on the BUILD (hero + artifact paperdoll + stats).
    - Selection happens in OVERLAYS opened by clicking the hero header or a paperdoll slot.
    - #detail-overlay-root stacks ABOVE for detail pages.
    - Overlays are statically sized; scroll is preserved on every re-render.
    - Traits are DATA (faction / set); banners theme via --aff-color/--aff-text; a
      cross-reference matrix surfaces shared faction/set synergy on the build view.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero's Hour Build Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The build view (build-first home screen) is rendered here by app.js. -->
  <div id="app"></div>

  <!-- Overlay layers, toggled via the .hidden class.
       #overlay-root        = selectors/pickers (z 100)
       #detail-overlay-root = detail pages, stacks ABOVE selectors (z 200) -->
  <div id="overlay-root" class="hidden" aria-hidden="true"></div>
  <div id="detail-overlay-root" class="hidden" aria-hidden="true"></div>

  <!-- data.js must load before app.js: it defines window.HH_DATA -->
  <script src="data.js"></script>
  <script src="app.js" defer></script>

  <!-- Cloudflare Web Analytics — LIVE (public release). Shared misterwtheface-oss.github.io
       hostname token (public-by-design); filter this tool by page path in the CF dashboard. -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b5abb0125b524ee8a96efbe9899114a4"}'></script>
</body>
</html>
